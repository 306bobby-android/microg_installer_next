name: Trusted CI

on:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - '*'

jobs:
  build:
    name: Build Trusted CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x updater/gradlew

      - name: Build microG Updater APK
        run: |
          cd updater
          ./gradlew assembleDebug

      - name: Copy Updater APK into module system structure
        run: |
          mkdir -p system/priv-app/microGUpdater system/product/priv-app/microGUpdater
          cp updater/app/build/outputs/apk/debug/app-debug.apk system/priv-app/microGUpdater/microGUpdater.apk
          cp updater/app/build/outputs/apk/debug/app-debug.apk system/product/priv-app/microGUpdater/microGUpdater.apk

      - name: Package Magisk Module Zip
        run: |
          zip -9r microG_Installer_Next.zip META-INF system customize.sh module.prop README.md CHANGELOG androidacy-config.json LICENSE -x "*.git*" "updater/*"

      - name: Upload Trusted CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trusted CI - microG_Installer_Next
          path: microG_Installer_Next.zip
